
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>DevOps CI/CD Dashboard</h1>
        <p>Build, Test, and Deploy with Automation</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Application Status</h2>
            <p id="status">Application is running successfully!</p>
            <button onclick="checkStatus()">Check Status</button>
        </section>

        <section class="card">
            <h2>CI/CD Pipeline</h2>
            <ul>
                <li>Source Code: GitHub</li>
                <li>Build: Jenkins</li>
                <li>Containerization: Docker</li>
                <li>Deployment: Kubernetes</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>DevOps CI/CD Project | Learning Automation</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
